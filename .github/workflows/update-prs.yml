name: Update PR table

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch PRs
        run: |
          curl -s "https://api.github.com/search/issues?q=is:pr+author:LeeSamFong+is:merged&per_page=20" > prs.json

      - name: Generate Table
        run: |
          echo "| Project | PR | Description |" > table.md
          echo "|--------|----|-------------|" >> table.md

          jq -r '.items[] | 
          "| " + (.repository_url | split("/")[-2] + "/" + split("/")[-1]) +
          " | [#" + (.number|tostring) + "](" + .html_url + ")" +
          " | " + (.title | gsub("\\|"; "")) + " |"' prs.json >> table.md

      - name: Insert into README
        run: |
          awk '
          /<!--START_SECTION:prs-->/ {print; system("cat table.md"); skip=1; next}
          /<!--END_SECTION:prs-->/ {skip=0}
          !skip
          ' README.md > new.md

          mv new.md README.md

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "update PR table" || exit 0
          git push
